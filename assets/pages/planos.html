  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/cadastro.css" />
  <style>
    /* ajustes específicos da página de planos */
    .planos-section {
      padding: 80px 0;
      background: var(--cor-fundo);
    }
    .pricing-card {
      background: rgba(7, 18, 48, 0.95);
      border: 1px solid rgba(69, 124, 255, 0.3);
      border-radius: 28px;
      padding: 2rem 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      backdrop-filter: blur(4px);
    }
    .pricing-card:hover {
      transform: translateY(-8px);
      border-color: var(--azul-claro);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(69,124,255,0.2);
    }
    .pricing-card .preco {
      font-size: 3rem;
      font-weight: 800;
      color: var(--azul-claro);
      margin: 1rem 0;
    }
    .pricing-card .preco small {
      font-size: 1rem;
      font-weight: 500;
      color: var(--texto-suave);
    }
    .pricing-card ul {
      list-style: none;
      padding-left: 0;
      margin: 1.5rem 0;
    }
    .pricing-card li {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(69,124,255,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pricing-card li i {
      color: var(--verde-agua);
      width: 24px;
    }
    .btn-plano {
      background: linear-gradient(135deg, #1B39AD, #1B88E0);
      border: none;
      padding: 12px;
      font-weight: 700;
      border-radius: 40px;
      width: 100%;
      transition: all 0.3s;
    }
    .btn-plano:hover {
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(27,136,255,0.6);
    }
    .toggle-planos {
      max-width: 320px;
      margin: 0 auto 50px auto;
    }
    .toggle-planos .toggle-control {
      background: #0a0f1c;
    }
  </style>
</head>
<body>
  <header>
        <nav class="navbar navbar-expand-lg bg-dark sticky-top navazulbg" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="./index.html">
                    <img src="../images/logocortada.png" alt="Logo Apiscale" width="50" height="50">
                    <span class="brand-text">APISCALE</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto gap-lg-3">
                        <li class="nav-item"><a class="nav-link text-white" href="../../index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="../../index.html#sobre">Sobre</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="../../index.html#ferramentas">Ferramentas</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="../../index.html#jornadas">Jornadas</a>
                        </li>
                        <li class="nav-item"><a class="nav-link text-white" href="Suporte.html">Suporte</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="./planos.html">planos</a>
                        </li>
                    </ul>
            </div>
        </nav>
    </header>

  <main>
    <section class="planos-section">
      <div class="container">
        <div class="text-center mb-5">
          <span class="eyebrow justify-content-center">Escolha seu plano</span>
          <h2 class="display-5 fw-bold text-white">Planos que <span class="text-primary-emphasis">escalam</span> com você</h2>
          <p class="text-secondary">Preços diferenciados para Pessoa Física e Jurídica. Cancele quando quiser.</p>
        </div>

        <!-- Seletor PF/PJ (só aparece se não houver tipo salvo) -->
        <div id="tipoSelectorWrapper" class="toggle-planos" style="display: none;">
          <div class="account-toggle" aria-label="Tipo de conta">
            <input type="radio" id="plano-pf" name="tipo-plano" value="pf" checked>
            <input type="radio" id="plano-pj" name="tipo-plano" value="pj">
            <div class="toggle-control">
              <label for="plano-pf">Pessoa Física</label>
              <label for="plano-pj">Pessoa Jurídica</label>
              <span class="toggle-indicator"></span>
            </div>
          </div>
        </div>

        <div class="row g-4 justify-content-center" id="planosContainer">
          <!-- cards serão preenchidos via JS -->
        </div>
      </div>
    </section>
  </main>

  <footer class="stats-custom py-5">
    <div class="container">
      <div class="row text-center align-items-center g-4">
        <div class="col-6 col-md-3"><i class="fa-brands fa-instagram neon-vazado fa-5x"></i><h4 class="fw-bold">@apiscale_wevers</h4><p class="text-secondary">Instagram</p></div>
        <div class="col-6 col-md-3"><i class="fa-solid fa-at neon-vazado fa-5x"></i><h4 class="fw-bold">E-Mail</h4><p class="text-secondary">apiscalereal@gmail.com</p></div>
        <div class="col-6 col-md-3"><i class="fa-solid fa-phone neon-vazado fa-5x"></i><h4 class="fw-bold">(19) 99123-6769</h4><p class="text-secondary">Telefone</p></div>
        <div class="col-6 col-md-3"><img src="../images/logo.png" alt="Mascote" class="img-fluid p-2" style="max-width:140px"></div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Preços base para PF e PJ (ajuste conforme necessidade)
    const precos = {
      pf: {
        essencial: 29.90,
        avancado: 59.90,
        empresarial: 99.90
      },
      pj: {
        essencial: 99.90,
        avancado: 199.90,
        empresarial: 399.90
      }
    };

    const recursos = {
      essencial: ['Até 5 usuários', 'Métricas básicas', 'Suporte por e-mail', '1 jornada personalizada'],
      avancado: ['Até 20 usuários', 'Métricas avançadas + OKRs', 'Suporte prioritário', '3 jornadas personalizadas', 'Acompanhamento de progresso em tempo real'],
      empresarial: ['Usuários ilimitados', 'Business Intelligence', 'Suporte 24/7 dedicado', 'Jornadas personalizadas ilimitadas', 'API aberta', 'Onboarding estratégico']
    };

    let tipoAtual = localStorage.getItem('apiscale_tipo_conta'); // 'pf' ou 'pj'

    function exibirPlanos(tipo) {
      const container = document.getElementById('planosContainer');
      const planos = [
        { id: 'essencial', nome: 'Essencial', preco: precos[tipo].essencial, cor: '#457CFF' },
        { id: 'avancado', nome: 'Avançado', preco: precos[tipo].avancado, cor: '#1B88E0' },
        { id: 'empresarial', nome: 'Empresarial', preco: precos[tipo].empresarial, cor: '#009694' }
      ];

      container.innerHTML = planos.map(plano => `
        <div class="col-md-6 col-lg-4">
          <div class="pricing-card text-white">
            <h3 class="fw-bold">${plano.nome}</h3>
            <div class="preco">R$ ${plano.preco.toFixed(2).replace('.', ',')}<small>/mês</small></div>
            <ul>
              ${recursos[plano.id].map(r => `<li><i class="bi bi-check-circle-fill"></i> ${r}</li>`).join('')}
            </ul>
            <button class="btn btn-plano" data-plano="${plano.id}" data-tipo="${tipo}">Assinar agora</button>
          </div>
        </div>
      `).join('');

      // Evento dos botões
      document.querySelectorAll('.btn-plano').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const plano = btn.dataset.plano;
          const tipoConta = btn.dataset.tipo;
          alert(`Redirecionando para checkout do plano ${plano} (${tipoConta === 'pf' ? 'Pessoa Física' : 'Pessoa Jurídica'}).\nValor: R$ ${precos[tipoConta][plano].toFixed(2)}`);
          // Aqui você pode redirecionar para uma página de pagamento ou modal
        });
      });
    }

    // Gerencia o seletor visual (PF/PJ)
    function configurarSeletor() {
      const wrapper = document.getElementById('tipoSelectorWrapper');
      if (!tipoAtual) {
        wrapper.style.display = 'block';
        const radioPf = document.getElementById('plano-pf');
        const radioPj = document.getElementById('plano-pj');
        radioPf.addEventListener('change', () => { tipoAtual = 'pf'; exibirPlanos('pf'); localStorage.setItem('apiscale_tipo_conta', 'pf'); });
        radioPj.addEventListener('change', () => { tipoAtual = 'pj'; exibirPlanos('pj'); localStorage.setItem('apiscale_tipo_conta', 'pj'); });
        exibirPlanos('pf'); // default
      } else {
        wrapper.style.display = 'none';
        exibirPlanos(tipoAtual);
      }
    }

    configurarSeletor();
  </script>
</body>
</html>
